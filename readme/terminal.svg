  <text class="titre" x="600" y="27" text-anchor="middle">iro007 — bash — goma</text>
  <g opacity="0"><set attributeName="opacity" to="1" begin="0.35s" fill="freeze"/><text x="40" y="92"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><text class="cmd" x="211.0" y="92" clip-path="url(#c0)">whoami</text></g><text class="out" x="40" y="122" opacity="0">Iro007. Développeur web et mobile, basé à Goma (RDC).<animate attributeName="opacity" from="0" to="1" begin="1.21s" dur=".35s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="1.61s" fill="freeze"/><text x="40" y="164"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><text class="cmd" x="211.0" y="164" clip-path="url(#c2)">cat mission.txt</text></g><text class="out" x="40" y="194" opacity="0">Des applis qui tiennent le terrain : réseau qui coupe,<animate attributeName="opacity" from="0" to="1" begin="3.01s" dur=".35s" fill="freeze"/></text><text class="out" x="40" y="224" opacity="0">téléphones modestes, paiement par mobile money.<animate attributeName="opacity" from="0" to="1" begin="3.31s" dur=".35s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="3.71s" fill="freeze"/><text x="40" y="266"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><text class="cmd" x="211.0" y="266" clip-path="url(#c5)">ls projets/</text></g><text class="dir" x="40" y="296" opacity="0">RHEEKA/    Kitty/     Estory/    Manga_site/<animate attributeName="opacity" from="0" to="1" begin="4.87s" dur=".35s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="5.27s" fill="freeze"/><text x="40" y="338"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><text class="cmd" x="211.0" y="338" clip-path="url(#c7)">cat stack.txt</text></g><text class="out" x="40" y="368" opacity="0">Flutter · React · TypeScript · Supabase · PostgreSQL · LiveKit<animate attributeName="opacity" from="0" to="1" begin="6.55s" dur=".35s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="6.95s" fill="freeze"/><text x="40" y="410"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><text class="cmd" x="211.0" y="410" clip-path="url(#c9)">echo $STATUT</text></g><text class="ok" x="40" y="440" opacity="0">Ouvert aux collaborations. Toujours en train d&#x27;apprendre.<animate attributeName="opacity" from="0" to="1" begin="8.17s" dur=".35s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="8.47s" fill="freeze"/><text x="40" y="470"><tspan class="inv">iro007@goma</tspan><tspan class="sep">:</tspan><tspan class="chem">~</tspan><tspan class="sep">$ </tspan></text><rect x="211.0" y="453" width="11" height="22" fill="#f26b3a"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g>

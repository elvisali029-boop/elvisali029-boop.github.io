<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<style>
  .n { font: 800 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -2px; }
  .l { font: 700 19px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f4f4f7; }
  .d { font: 400 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #9a9ab0; }
  .entre { opacity: 0; animation: entre .9s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes entre { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
</style>
<g class="entre" style="animation-delay:0.15s">
  <rect x="24" y="24" width="270" height="192" rx="18" fill="#151522" stroke="#fff" stroke-opacity=".07"/>
  <rect x="24" y="24" width="270" height="4" rx="2" fill="#f26b3a"><animate attributeName="width" from="0" to="270" begin="0.45s" dur="1s" fill="freeze"/></rect>
  <text class="n" x="50" y="112" fill="#f26b3a">3</text>
  <text class="l" x="50" y="152">applis en ligne</text>
  <text class="d" x="50" y="182">RHEEKA, Kitty, Estory</text>
</g><g class="entre" style="animation-delay:0.30s">
  <rect x="318" y="24" width="270" height="192" rx="18" fill="#151522" stroke="#fff" stroke-opacity=".07"/>
  <rect x="318" y="24" width="270" height="4" rx="2" fill="#3b82f6"><animate attributeName="width" from="0" to="270" begin="0.60s" dur="1s" fill="freeze"/></rect>
  <text class="n" x="344" y="112" fill="#3b82f6">600+</text>
  <text class="l" x="344" y="152">tests de base de données</text>
  <text class="d" x="344" y="182">chaque règle vérifiée</text>
</g><g class="entre" style="animation-delay:0.45s">
  <rect x="612" y="24" width="270" height="192" rx="18" fill="#151522" stroke="#fff" stroke-opacity=".07"/>
  <rect x="612" y="24" width="270" height="4" rx="2" fill="#e9a91b"><animate attributeName="width" from="0" to="270" begin="0.75s" dur="1s" fill="freeze"/></rect>
  <text class="n" x="638" y="112" fill="#e9a91b">18</text>
  <text class="l" x="638" y="152">quartiers de Goma</text>
  <text class="d" x="638" y="182">dessinés sur la carte</text>
</g><g class="entre" style="animation-delay:0.60s">
  <rect x="906" y="24" width="270" height="192" rx="18" fill="#151522" stroke="#fff" stroke-opacity=".07"/>
  <rect x="906" y="24" width="270" height="4" rx="2" fill="#2dd4bf"><animate attributeName="width" from="0" to="270" begin="0.90s" dur="1s" fill="freeze"/></rect>
  <text class="n" x="932" y="112" fill="#2dd4bf">72</text>
  <text class="l" x="932" y="152">stickers originaux</text>
  <text class="d" x="932" y="182">dessinés pour Kitty</text>
</g>
</svg>